<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
    }
    #container{
        position: fixed;
        width: 365px;
        height: 365px;
        box-shadow: 0px 0px 10px 20px #ccc;
        left: 50%;
        top: -1000px;
        transition: 0.5s ;
        transform: translate(-50%,-50%);
    }
     /* #container .show{
        top:50%;
        display: block;
    } */
   #heading{
        text-align: center;
        font-size: 20px;
        text-transform: uppercase;
        position: relative;
        border-bottom: 1px solid #ccc;
   }
   #close{
       position:absolute;
       right: 10px;
       font-size: 20px;
       font-weight: 900;
       cursor: pointer;
   }
</style>
<body> 
    <div id="container">
      <h2 id="heading">Contact Us <span id="close">&times;</span></h2>
    </div>
    <button>Show</button>
</body>
<script>
      let btn = document.querySelector("button")
      let containerElement = document.querySelector("#container")
      let closeElemnet = document.querySelector("#close")
      let body=document.querySelector("body")

    //   btn.addEventListener("click",()=>{
    //     containerElement.classList.add("show")
    //   })
     btn.addEventListener("click",()=>{
        containerElement.style.top="50%"
      })
      closeElemnet.addEventListener("click",()=>{
        containerElement.style.top="-1000px"
      })
      
</script>
</html>
