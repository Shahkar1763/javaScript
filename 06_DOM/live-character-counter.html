<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
            margin: 0px;
            padding: 0px;
            font-family: sans-serif;
            text-decoration: none;
            list-style: none;
        }
        .main{
            width: 1000px;
            margin: auto;
        }
        textarea{
            width: 100%;
            height: 200px;
            padding: 10px;

        }
        #resDev{
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="main">
       <textarea name="" id=""></textarea>
       <h2>Lenght :<span>0</span></h2>
       <div id="resDev">

       </div>
    </div>
</body>
<script>
    let textareaElement = document.querySelector("textarea")
    let LenghtElement = document.querySelector("h2 span")
    let responseElement = document.querySelector("#resDev")

    textareaElement.addEventListener("keyup",()=>{
        responseElement.innerHTML = textareaElement.value
        LenghtElement.innerHTML = textareaElement.value.length
    })
</script>
</html>
