<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="dark">Dark Mode</button>
    <button id="light">Light Mode</button>

    <h1>hello shahkar how are you</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Saepe itaque asperiores officia esse quas quos iusto veritatis quasi, aperiam inventore libero nobis sequi reiciendis adipisci dolorum nulla rerum similique quia?</p>

    <script>
        let btnDark = document.querySelector("#dark")
          let btnlight = document.querySelector("#light")
            let body = document.querySelector("body")

            btnDark.addEventListener("click",()=>{
                body.style.background = "black"
                 body.style.color = "white"
            })

             btnlight.addEventListener("click",()=>{
                body.style.background = "white"
                 body.style.color = "black"
            })
    </script>
</body>
</html>
