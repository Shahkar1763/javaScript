<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: grey;
            text-align: center;
        }
        #height{
            padding : 5px;
            margin-left : 8px;
            border : 1px solid black;
            border-radius : 3px;
        }
        #weight{
            padding : 5px;
            margin-left : 8px;
            border : 1px solid black;
            border-radius : 3px;
        }
        button{
            border : 2px solid black;
            border-radius: 5px;
            padding : 5px;
            /* height: 100px; */
            width: 100px;
        }
        #result{
            padding-top: 10px;
            color:white;
            font-size: larger;
        }
        #wight-guide  {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>BMI Calculator</h1>
    <form>
        <p><label>Hight in CM:</label><input text="" id="height"></p>
        <p><label>Weight in kg:</label><input text="" id="weight"></p>

        <button>Calculator</button>
        <div id="result"></div>
        <div id="wight-guide">
        <h2>BMI weight Guide</h2>
        <p>under weight : less then 18.6</p>
        <p>Normal Range : 18.6 and 20.5</p>
        <p>uoverweight : Greater than 24.6</p>
        </div>
    </form>

    
</body>

<script>
    const forms = document.querySelector("form")

    forms.addEventListener('submit',(e)=>{
     e.preventDefault();

     const height = parseInt(document.querySelector("#height").value)
     const weight = parseInt(document.querySelector("#weight").value)

     const result = document.querySelector("#result")

     if(height === " " || height < 0 || isNaN(height)){
        result.innerHTML = `please give a valid height ${height}`;
     }
        else if (weight === " " || weight < 0 || isNaN(weight)){
        result.innerHTML = `please give a valid weight ${weight}`;
        }
        else{
            const bmi = (weight / ((height * height)/10000)).toFixed(2);
            result.innerHTML = `<span>${bmi}</span>`;
        
        }
    })
</script>
</html>
