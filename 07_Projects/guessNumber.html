<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            color: aliceblue;
            text-align: center;
           
        }
        .container {
             display: flex;
            justify-content: center;
            align-items: center;
        }
        #wrapper {
            background-color: grey;
            height: 500px;
            width: 400px;
            
           
        }
         label {
            font-size: larger;
            color: black;
            font-weight: 900;
        }
        #guess{
            margin-top: 10px;
            padding: 5px;
            border: 2px solid black;
            border-radius: 5px;
        }
        #subt{
            margin-top: 20px;
            padding: 8px;
            background-color: black;
            color: white;
            border: 1px solid black;
            border-radius: 5px;
        }
        #new-Game{
            height: 50px;
            /* width: 200px; */
            background-color: black;
            border: 1px solid black;
            border-radius: 5px;
            color: azure;
            padding: 5px;
            text-align: center;
        }



    </style>
</head>
<body>
    
    <h1>Number Guessing Game</h1>
    <div class="container">
    <div id="wrapper">
    <p>Try and guess the number between 1 to 100</p>
    <p>you have 10 attempt to guess the right number</p>

    <form class="form">
         <label id="guess-Field">Guess the number</label>
         <br>
         <input type="text" id="guess">
         <br>
         <input type="submit" id="subt" value="submit Guess">
    </form>
    <div class="result">
       <p>pervious Guess: <span class="guesses"></span></p>
       <p>Guess Remaining: <span class="lastResult">10</span></p>
       <p class="loworhigh"></p>
    </div>
    </div>
    </div>
</body>

<script>
    let  randomNumber = (parseInt(Math.random()*100 + 1))

    const submit = document.querySelector("#subt")
    const userInput = document.querySelector("#guess")
    const guessSlot = document.querySelector(".guesses")
    const remaining = document.querySelector(".lastResult")
    const loworhigh = document.querySelector(".loworhigh")
    const startOver = document.querySelector(".result")

    const p = document.createElement("p")

    let pervGuess = []
    let numGuess = 1

    let playgame = true;

    if(playgame){
        submit.addEventListener("click",function(e){
            e.preventDefault();
            const guess = parseInt(userInput.value)
            // console.log(guess)
            validateNumber(guess);
        })
    }

    function validateNumber(guess){
        if(isNaN(guess)){
            alert("please enter a valid Number")
        }
        else if(guess < 1){
            alert("please enter a number Greater than 1")
        }
        else if(guess > 100){
            alert("please enter a number less than 100")
        }
        else {
            pervGuess.push(guess)
            if(numGuess === 11){
                displayGuess(guess)
                displayMassage(`Game over The random number is ${randomNumber}`)
                endGame()
            }
            else{
                checkGuess(guess)
                displayGuess(guess)
            }
        }

    }
    function checkGuess(guess){
   if(guess === randomNumber) {
     displayMassage('You guess a right number congrajulation')
     endGame()
   }
   else if(guess < randomNumber) {
     displayMassage('Number is too Low')
   }
   else if(guess > randomNumber) {
     displayMassage('Number is too high')
   }

    }
    function displayGuess(guess){
      userInput.value = " ";
      guessSlot.innerHTML += `${guess}   `
      numGuess++;
      remaining.innerHTML = `${11 - numGuess}`
    }
    function displayMassage(massage){
      loworhigh.innerHTML = `<h2>${massage}</h2>`
    }
    function endGame(){
   userInput.value = " "
   userInput.setAttribute(`disabled`, ` `)
   p.classList.add("button")
   p.innerHTML = `<span><h2 id="new-Game">start new game</h2></span>`;
   startOver.appendChild(p)
   playgame = false;
   newGame()
    }
    function newGame(){
        const newGameButton = document.querySelector("#new-Game")
        newGameButton.addEventListener(`click`,function(e){
            randomNumber = (parseInt(Math.random()*100 + 1))
        pervGuess  = []
        numGuess = 1;
          guessSlot.innerHTML = " ";
          remaining.innerHTML = `${11 - numGuess}`
          userInput.removeAttribute("disabled")
          startOver.removeChild(p)
          playgame = true;
        })
      
    }
</script>
</html>
