<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table,
    th,
    td{
        border: 1px solid #e7e7e7;
    }
    .project{
        background-color: #1c1c1c;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100vh;
        /* border: 1px solid #e7e7e7; */
    }
    #color{
        display: flex;
        flex-direction: row;
    }
</style>
<body>
    <div class="project">
        <div id="insert">
            <h2>Press any key and watch magic</h2>
        </div>
    </div>
</body>

<script>
         const insert = document.getElementById("insert")
         window.addEventListener("keydown",(e)=>{
              insert.innerHTML = `
              <div id="color">
                <table>
                    <tr>
                        <th>key</th>
                        <th>keyCode</th>
                        <th>code</th>
                        </tr>

                        <tr>
                            <td>${e.key === " " ? "space" : e.key }</td>
                            <td>${e.keyCode}</td>
                            <td>${e.code}</td>
                            </tr>
                    </table>
                </div>
              `
         })
</script>
</html>
